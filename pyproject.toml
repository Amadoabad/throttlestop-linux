[project]
name = "throttlestop-linux"
version = "0.1.0"
description = "Native Linux port of ThrottleStop mechanisms (Haswell-first): MSR undervolt, power limits, turbo, BD PROCHOT, clock-mod, monitoring, reset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
tslinux = "tslinux.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tslinux"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
